<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Quant 课程工具</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #d8dee9;
      --blue: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      letter-spacing: 0;
    }
    .lead {
      margin: 0 0 28px;
      color: var(--muted);
      line-height: 1.7;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    a.card {
      display: block;
      min-height: 150px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .06);
    }
    a.card:hover { border-color: #9db7f5; }
    .eyebrow {
      margin-bottom: 12px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 20px;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>AI Quant 课程工具</h1>
    <p class="lead">量化课程数据面板和技术指标交互工具。所有页面均为静态页面，可直接在 GitHub Pages 上浏览。</p>
    <div class="grid">
      <a class="card" href="dashboard/shitou_panel.html">
        <div class="eyebrow">Quant Course 01</div>
        <h2>狮头股份近一年行情面板</h2>
        <p>查看狮头股份日线行情、成交量和基础统计。</p>
      </a>
      <a class="card" href="quant_course_02/dashboard/indicator_tool.html">
        <div class="eyebrow">Quant Course 02</div>
        <h2>股票技术指标工作台</h2>
        <p>选择股票并调节 RSI、MACD、布林带、ATR 参数，实时重算和重绘指标。</p>
      </a>
      <a class="card" href="quant_course_03/index.html">
        <div class="eyebrow">Quant Course 03</div>
        <h2>MA 均线交叉策略回测看板</h2>
        <p>多股票切换、均线参数调节、交易成本设置，实时计算策略指标并可视化回测结果。支持 CSV 数据导入。</p>
      </a>
    </div>
  </main>
</body>
</html>
