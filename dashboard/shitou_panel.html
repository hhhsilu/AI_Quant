<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>狮头股份近一年行情面板</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #17212b;
      --muted: #66717d;
      --line: #d8e0e8;
      --rise: #d93f3f;
      --fall: #168b61;
      --accent: #2563eb;
      --shadow: 0 12px 30px rgba(20, 32, 46, 0.08);
    }

    * { box-sizing: border-box; }

    p {
      margin: 0;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: SimSun, "宋体", serif;
      font-size: 10.5pt;
      line-height: 1.5;
      text-align: justify;
    }

    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 22px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 18pt;
      line-height: 1.5;
      font-weight: 760;
      letter-spacing: 0;
      text-align: left;
    }

    .sub {
      color: var(--muted);
      font-size: 10.5pt;
      text-align: left;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    button {
      height: 34px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 6px;
      padding: 0 12px;
      cursor: pointer;
      font-weight: 620;
      font-family: inherit;
      font-size: 10.5pt;
    }

    button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .label {
      color: var(--muted);
      font-size: 10.5pt;
      margin-bottom: 7px;
      text-align: left;
    }

    .value {
      font-size: 15pt;
      font-weight: 760;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chart-wrap {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 14px;
      margin-bottom: 14px;
    }

    .chart-title {
      font-size: 10.5pt;
      line-height: 1.5;
      font-weight: 700;
      text-align: center;
    }

    .chart-note {
      color: var(--muted);
      font-size: 10.5pt;
      line-height: 1.5;
      text-align: justify;
    }

    .close-chart {
      height: 380px;
    }

    canvas {
      width: 100%;
      height: 640px;
      display: block;
      margin-top: 8px;
    }

    .foot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 10.5pt;
      flex-wrap: wrap;
    }

    .tooltip {
      position: fixed;
      z-index: 10;
      min-width: 206px;
      max-width: 280px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--shadow);
      padding: 8px 10px;
      color: var(--ink);
      line-height: 1.5;
      text-align: left;
      pointer-events: none;
      display: none;
    }

    .tooltip strong {
      display: block;
      margin: 0;
      font-weight: 700;
    }

    @media (max-width: 820px) {
      .app { padding: 14px; }
      header { grid-template-columns: 1fr; align-items: start; }
      .toolbar { justify-content: flex-start; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      canvas { height: 560px; }
      .close-chart { height: 340px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>狮头股份 600539.SH</h1>
        <div class="sub" id="subtitle">加载本地 Tushare 数据...</div>
      </div>
      <div class="toolbar" aria-label="区间选择">
        <button data-window="60">60日</button>
        <button data-window="120">120日</button>
        <button data-window="365" class="active">近一年</button>
      </div>
    </header>

    <section class="stats" aria-label="行情摘要">
      <div class="stat"><div class="label">最新收盘</div><div class="value" id="lastClose">--</div></div>
      <div class="stat"><div class="label">区间涨跌幅</div><div class="value" id="rangePct">--</div></div>
      <div class="stat"><div class="label">区间最高</div><div class="value" id="maxHigh">--</div></div>
      <div class="stat"><div class="label">区间最低</div><div class="value" id="minLow">--</div></div>
      <div class="stat"><div class="label">均量（手）</div><div class="value" id="avgVol">--</div></div>
    </section>

    <section class="chart-wrap">
      <p class="chart-title">图1 狮头股份近一年K线与成交量图</p>
      <p class="chart-note" id="klineNote">正在生成图表解读。</p>
      <canvas id="chart" aria-label="K线图和成交量图"></canvas>
      <div class="foot">
        <span>红色表示上涨，绿色表示下跌；成交量单位为手。</span>
        <span id="sourceNote"></span>
      </div>
    </section>

    <section class="chart-wrap">
      <p class="chart-title">图2 狮头股份近一年每日收盘价曲线图</p>
      <p class="chart-note" id="closeNote">正在生成图表解读。</p>
      <canvas id="closeChart" class="close-chart" aria-label="每日收盘价曲线图"></canvas>
      <div class="foot">
        <span>蓝色曲线表示每日收盘价，浅色参考线表示区间均价。</span>
        <span id="closeSourceNote"></span>
      </div>
    </section>
  </main>

  <div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>

  <script src="../data/shitou_600539_daily.js"></script>
  <script>
    const payload = window.SHITOU_DAILY || { metadata: {}, data: [] };
    const allRows = payload.data || [];
    let activeWindow = 365;
    let hoverState = { chart: null, closeChart: null };
    const chartMeta = {};

    const fmtDate = value => `${value.slice(0, 4)}-${value.slice(4, 6)}-${value.slice(6, 8)}`;
    const fmtPrice = value => Number(value).toFixed(2);
    const fmtPct = value => `${value >= 0 ? "+" : ""}${value.toFixed(2)}%`;
    const fmtVol = value => Math.round(value).toLocaleString("zh-CN");

    function visibleRows() {
      return allRows.slice(Math.max(0, allRows.length - activeWindow));
    }

    function setRangeByWindow(days) {
      activeWindow = days;
      drawAll();
    }

    function updateStats(rows) {
      if (!rows.length) return;
      const first = rows[0];
      const last = rows[rows.length - 1];
      const pct = (last.close / first.close - 1) * 100;
      const maxHigh = Math.max(...rows.map(d => d.high));
      const minLow = Math.min(...rows.map(d => d.low));
      const avgVol = rows.reduce((sum, d) => sum + d.volume_hands, 0) / rows.length;
      const maxCloseRow = rows.reduce((best, d) => d.close > best.close ? d : best, rows[0]);
      const minCloseRow = rows.reduce((best, d) => d.close < best.close ? d : best, rows[0]);
      const avgClose = rows.reduce((sum, d) => sum + d.close, 0) / rows.length;
      const latestVsAvg = (last.close / avgClose - 1) * 100;

      document.getElementById("subtitle").textContent =
        `${fmtDate(rows[0].date)} 至 ${fmtDate(last.date)}，共 ${rows.length} 个交易日`;
      document.getElementById("lastClose").textContent = `${fmtPrice(last.close)} 元`;
      document.getElementById("rangePct").textContent = fmtPct(pct);
      document.getElementById("rangePct").style.color = pct >= 0 ? "var(--rise)" : "var(--fall)";
      document.getElementById("maxHigh").textContent = `${fmtPrice(maxHigh)} 元`;
      document.getElementById("minLow").textContent = `${fmtPrice(minLow)} 元`;
      document.getElementById("avgVol").textContent = fmtVol(avgVol);
      document.getElementById("sourceNote").textContent =
        `${payload.metadata.source || "Tushare"}，更新至 ${fmtDate(payload.metadata.last_trade_date || last.date)}`;
      document.getElementById("closeSourceNote").textContent =
        `${payload.metadata.source || "Tushare"}，收盘价单位：元`;
      document.getElementById("klineNote").textContent =
        `图1显示，所选区间内股价由${fmtPrice(first.close)}元变动至${fmtPrice(last.close)}元，区间涨跌幅为${fmtPct(pct)}；盘中最高价为${fmtPrice(maxHigh)}元，最低价为${fmtPrice(minLow)}元，成交量均值为${fmtVol(avgVol)}手。成交量柱与K线波动相互对照，可观察价格快速上行或回落时是否伴随放量。`;
      document.getElementById("closeNote").textContent =
        `图2显示，所选区间内收盘价最高为${fmtPrice(maxCloseRow.close)}元（${fmtDate(maxCloseRow.date)}），最低为${fmtPrice(minCloseRow.close)}元（${fmtDate(minCloseRow.date)}），区间均价为${fmtPrice(avgClose)}元；最新收盘价较区间均价${latestVsAvg >= 0 ? "高" : "低"}${Math.abs(latestVsAvg).toFixed(2)}%，反映当前价格相对近一年中枢的位置。`;
    }

    function tooltipHtml(d, mode) {
      const pct = d.pre_close ? (d.close / d.pre_close - 1) * 100 : d.pct_chg;
      const lines = [
        `<strong>${fmtDate(d.date)}</strong>`,
        `开盘：${fmtPrice(d.open)} 元`,
        `最高：${fmtPrice(d.high)} 元`,
        `最低：${fmtPrice(d.low)} 元`,
        `收盘：${fmtPrice(d.close)} 元`,
      ];
      if (mode === "kline") {
        lines.push(`成交量：${fmtVol(d.volume_hands)} 手`);
        lines.push(`成交额：${fmtVol(d.amount_thousand_yuan)} 千元`);
      }
      lines.push(`涨跌幅：${fmtPct(pct)}`);
      return lines.join("<br>");
    }

    function showTooltip(evt, row, mode) {
      const tooltip = document.getElementById("tooltip");
      tooltip.innerHTML = tooltipHtml(row, mode);
      tooltip.style.display = "block";
      const pad = 14;
      const rect = tooltip.getBoundingClientRect();
      let left = evt.clientX + 16;
      let top = evt.clientY + 16;
      if (left + rect.width + pad > window.innerWidth) left = evt.clientX - rect.width - 16;
      if (top + rect.height + pad > window.innerHeight) top = evt.clientY - rect.height - 16;
      tooltip.style.left = `${Math.max(pad, left)}px`;
      tooltip.style.top = `${Math.max(pad, top)}px`;
    }

    function hideTooltip(chartId) {
      hoverState[chartId] = null;
      document.getElementById("tooltip").style.display = "none";
      drawAll();
    }

    function setupCanvas(canvas) {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * ratio));
      canvas.height = Math.max(1, Math.floor(rect.height * ratio));
      const ctx = canvas.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      return { ctx, width: rect.width, height: rect.height };
    }

    function drawHoverGuide(ctx, meta, hoverIndex, mode) {
      if (hoverIndex == null || !meta.rows[hoverIndex]) return;
      const row = meta.rows[hoverIndex];
      const cx = meta.x(hoverIndex);
      ctx.save();
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(cx, meta.pad.top);
      ctx.lineTo(cx, meta.height - meta.pad.bottom);
      ctx.stroke();
      ctx.restore();

      if (mode === "close") {
        ctx.fillStyle = "#2563eb";
        ctx.beginPath();
        ctx.arc(cx, meta.y(row.close), 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawChart() {
      const canvas = document.getElementById("chart");
      const { ctx, width, height } = setupCanvas(canvas);
      const rows = visibleRows();
      updateStats(rows);

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);

      if (!rows.length) {
        ctx.fillStyle = "#66717d";
        ctx.font = "10.5pt SimSun, serif";
        ctx.fillText("没有可绘制的数据，请先运行 scripts/fetch_shitou_tushare.py", 24, 42);
        return;
      }

      const pad = { left: 54, right: 18, top: 18, bottom: 38 };
      const priceH = Math.floor((height - pad.top - pad.bottom) * 0.68);
      const gap = 22;
      const volTop = pad.top + priceH + gap;
      const volH = height - volTop - pad.bottom;
      const plotW = width - pad.left - pad.right;
      const priceMin = Math.min(...rows.map(d => d.low));
      const priceMax = Math.max(...rows.map(d => d.high));
      const pricePad = Math.max(0.08, (priceMax - priceMin) * 0.08);
      const yMin = priceMin - pricePad;
      const yMax = priceMax + pricePad;
      const maxVol = Math.max(...rows.map(d => d.volume_hands));
      const step = plotW / rows.length;
      const bodyW = Math.max(2, Math.min(12, step * 0.58));

      const x = i => pad.left + step * i + step / 2;
      const yPrice = price => pad.top + (yMax - price) / (yMax - yMin) * priceH;
      const yVol = vol => volTop + volH - vol / maxVol * volH;
      chartMeta.chart = { rows, pad, width, height, plotW, x, y: yPrice };

      ctx.strokeStyle = "#e6ebf0";
      ctx.lineWidth = 1;
      ctx.fillStyle = "#66717d";
      ctx.font = "10.5pt SimSun, serif";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";

      for (let i = 0; i <= 4; i++) {
        const yy = pad.top + priceH * i / 4;
        const val = yMax - (yMax - yMin) * i / 4;
        ctx.beginPath();
        ctx.moveTo(pad.left, yy);
        ctx.lineTo(width - pad.right, yy);
        ctx.stroke();
        ctx.fillText(fmtPrice(val), pad.left - 8, yy);
      }

      ctx.textBaseline = "alphabetic";
      ctx.fillText(fmtVol(maxVol), pad.left - 8, volTop + 6);
      ctx.beginPath();
      ctx.moveTo(pad.left, volTop);
      ctx.lineTo(width - pad.right, volTop);
      ctx.stroke();

      rows.forEach((d, i) => {
        const color = d.close >= d.open ? "#d93f3f" : "#168b61";
        const cx = x(i);
        const highY = yPrice(d.high);
        const lowY = yPrice(d.low);
        const openY = yPrice(d.open);
        const closeY = yPrice(d.close);
        const top = Math.min(openY, closeY);
        const bodyH = Math.max(1, Math.abs(openY - closeY));

        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(cx, highY);
        ctx.lineTo(cx, lowY);
        ctx.stroke();
        ctx.fillRect(cx - bodyW / 2, top, bodyW, bodyH);

        const vh = volTop + volH - yVol(d.volume_hands);
        ctx.globalAlpha = 0.72;
        ctx.fillRect(cx - bodyW / 2, yVol(d.volume_hands), bodyW, vh);
        ctx.globalAlpha = 1;
      });

      ctx.fillStyle = "#66717d";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const labelCount = Math.min(6, rows.length);
      for (let i = 0; i < labelCount; i++) {
        const idx = Math.round((rows.length - 1) * i / (labelCount - 1 || 1));
        ctx.fillText(fmtDate(rows[idx].date).slice(5), x(idx), height - pad.bottom + 12);
      }

      ctx.fillStyle = "#17212b";
      ctx.textAlign = "left";
      ctx.font = "10.5pt SimSun, serif";
      ctx.fillText("K线", pad.left, 8);
      ctx.fillText("成交量", pad.left, volTop - 16);
      drawHoverGuide(ctx, chartMeta.chart, hoverState.chart, "kline");
    }

    function drawCloseChart() {
      const canvas = document.getElementById("closeChart");
      const { ctx, width, height } = setupCanvas(canvas);
      const rows = visibleRows();

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);

      if (!rows.length) {
        ctx.fillStyle = "#66717d";
        ctx.font = "10.5pt SimSun, serif";
        ctx.fillText("没有可绘制的数据，请先运行 scripts/fetch_shitou_tushare.py", 24, 42);
        return;
      }

      const pad = { left: 54, right: 18, top: 18, bottom: 38 };
      const plotW = width - pad.left - pad.right;
      const plotH = height - pad.top - pad.bottom;
      const minClose = Math.min(...rows.map(d => d.close));
      const maxClose = Math.max(...rows.map(d => d.close));
      const avgClose = rows.reduce((sum, d) => sum + d.close, 0) / rows.length;
      const yPad = Math.max(0.08, (maxClose - minClose) * 0.1);
      const yMin = minClose - yPad;
      const yMax = maxClose + yPad;
      const step = plotW / Math.max(1, rows.length - 1);
      const x = i => pad.left + step * i;
      const y = value => pad.top + (yMax - value) / (yMax - yMin) * plotH;
      chartMeta.closeChart = { rows, pad, width, height, plotW, x, y };

      ctx.strokeStyle = "#e6ebf0";
      ctx.lineWidth = 1;
      ctx.fillStyle = "#66717d";
      ctx.font = "10.5pt SimSun, serif";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";

      for (let i = 0; i <= 4; i++) {
        const yy = pad.top + plotH * i / 4;
        const val = yMax - (yMax - yMin) * i / 4;
        ctx.beginPath();
        ctx.moveTo(pad.left, yy);
        ctx.lineTo(width - pad.right, yy);
        ctx.stroke();
        ctx.fillText(fmtPrice(val), pad.left - 8, yy);
      }

      ctx.save();
      ctx.setLineDash([6, 5]);
      ctx.strokeStyle = "#9aa7b5";
      ctx.beginPath();
      ctx.moveTo(pad.left, y(avgClose));
      ctx.lineTo(width - pad.right, y(avgClose));
      ctx.stroke();
      ctx.restore();

      ctx.strokeStyle = "#2563eb";
      ctx.lineWidth = 2;
      ctx.beginPath();
      rows.forEach((d, i) => {
        const px = x(i);
        const py = y(d.close);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.stroke();

      const first = rows[0];
      const last = rows[rows.length - 1];
      [[0, first], [rows.length - 1, last]].forEach(([i, d]) => {
        ctx.fillStyle = d.close >= first.close ? "#d93f3f" : "#168b61";
        ctx.beginPath();
        ctx.arc(x(i), y(d.close), 4, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = "#66717d";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const labelCount = Math.min(6, rows.length);
      for (let i = 0; i < labelCount; i++) {
        const idx = Math.round((rows.length - 1) * i / (labelCount - 1 || 1));
        ctx.fillText(fmtDate(rows[idx].date).slice(5), x(idx), height - pad.bottom + 12);
      }

      ctx.fillStyle = "#17212b";
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(`均价 ${fmtPrice(avgClose)}元`, pad.left + 8, Math.max(18, y(avgClose) - 8));
      drawHoverGuide(ctx, chartMeta.closeChart, hoverState.closeChart, "close");
    }

    function drawAll() {
      drawChart();
      drawCloseChart();
    }

    function attachHover(canvasId, mode) {
      const canvas = document.getElementById(canvasId);
      canvas.addEventListener("mousemove", evt => {
        const meta = chartMeta[canvasId];
        if (!meta || !meta.rows.length) return;
        const rect = canvas.getBoundingClientRect();
        const mx = evt.clientX - rect.left;
        if (mx < meta.pad.left || mx > meta.width - meta.pad.right) {
          hideTooltip(canvasId);
          return;
        }
        let idx;
        if (canvasId === "chart") {
          const step = meta.plotW / meta.rows.length;
          idx = Math.floor((mx - meta.pad.left) / step);
        } else {
          const step = meta.plotW / Math.max(1, meta.rows.length - 1);
          idx = Math.round((mx - meta.pad.left) / step);
        }
        idx = Math.max(0, Math.min(meta.rows.length - 1, idx));
        hoverState[canvasId] = idx;
        drawAll();
        showTooltip(evt, meta.rows[idx], mode);
      });
      canvas.addEventListener("mouseleave", () => hideTooltip(canvasId));
    }

    document.querySelectorAll("button[data-window]").forEach(btn => {
      btn.addEventListener("click", () => {
        setRangeByWindow(Number(btn.dataset.window));
        document.querySelectorAll("button[data-window]").forEach(item => item.classList.remove("active"));
        btn.classList.add("active");
      });
    });

    window.addEventListener("resize", drawAll);
    attachHover("chart", "kline");
    attachHover("closeChart", "close");
    setRangeByWindow(365);
  </script>
</body>
</html>
